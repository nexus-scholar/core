name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        exclude:
          - php: '8.3'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Checkout graph package path repositories
        run: |
          git clone --depth 1 https://github.com/mbsoft31/graph-core.git ../graph-core
          git clone --depth 1 https://github.com/nexus-scholar/graph-algorithms.git ../graph-algorithms

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Require specified Laravel and Testbench versions
        run: |
          if [ "${{ matrix.laravel }}" == "12.*" ]; then
            composer require "illuminate/contracts:^12.0" "orchestra/testbench:^10.0" --dev --no-interaction --no-update
          elif [ "${{ matrix.laravel }}" == "13.*" ]; then
            composer require "illuminate/contracts:^13.0" "orchestra/testbench:^11.0" --dev --no-interaction --no-update
          fi

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: composer test

      - name: Execute static analysis
        run: composer analyse

      - name: Check code style
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files=$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}"...HEAD -- '*.php')
          else
            files=$(git diff-tree --no-commit-id --name-only -r HEAD -- '*.php')
          fi

          if [ -n "$files" ]; then
            vendor/bin/pint --test $files
          else
            echo "No changed PHP files to format-check."
          fi
